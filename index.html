<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171b25"><title>Дворовые разборки: Казань 1996</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10141d;color:#f4e8ce;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}#game{display:block;width:100%;height:100%;image-rendering:pixelated;background:#171b25}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:12px 14px}.panel{background:#151923dd;border:2px solid #6f6250;padding:7px 10px;box-shadow:3px 3px #080a0f;font-weight:800;text-shadow:2px 2px #000}.meter{width:150px;height:10px;background:#3a2830;border:1px solid #d6c6a5;margin-top:4px}.fill{height:100%;background:#e1a64b;width:100%}#status{position:absolute;top:74px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:#f7dca5}#menu{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#10141dcc,#10141df2);padding:16px}#card{width:min(480px,100%);background:#252b37;border:3px solid #d3a45b;box-shadow:8px 8px #080a0f;padding:22px;text-align:center}h1{font-size:clamp(26px,6vw,42px);line-height:1.02;margin:0 0 8px;color:#f3c979;text-shadow:3px 3px #6d342d}p{color:#d7c9ae;font-size:14px}.row{display:flex;gap:8px;margin:10px 0}input,select,button{font:700 15px system-ui;border:2px solid #88765c;background:#151923;color:#f6e7c9;padding:11px;border-radius:0;min-width:0}input{width:50%}select{width:50%}button{cursor:pointer;background:#a74d35;border-color:#efbd6c;color:#fff5dc;width:100%;box-shadow:3px 3px #080a0f}button:active{transform:translate(2px,2px);box-shadow:1px 1px #080a0f}.small{font-size:11px;color:#b5a88f}#controls{position:fixed;bottom:14px;left:14px;right:14px;display:none;justify-content:space-between;align-items:end;pointer-events:none}.pad{width:126px;height:126px;border-radius:50%;background:#c7b18a30;border:2px solid #f4e8ce80;position:relative;pointer-events:auto;touch-action:none}.nub{position:absolute;width:48px;height:48px;left:37px;top:37px;border-radius:50%;background:#f4e8ceaa;border:2px solid #fff}.actions{display:grid;grid-template-columns:repeat(2,66px);gap:9px;pointer-events:auto}.act{height:62px;border-radius:50%;font-size:11px;padding:4px;background:#a74d35dd}.act.alt{background:#475d79dd}#toast{position:fixed;bottom:165px;left:50%;transform:translateX(-50%);background:#111923e8;padding:8px 12px;border:1px solid #d3a45b;display:none;font-weight:700;font-size:13px}
@media(min-width:800px){#controls{display:none!important}}@media(max-width:799px){#controls{display:flex}#status{top:82px}.meter{width:110px}}
</style></head><body>
<canvas id="game"></canvas><div id="hud"><div class="top"><div class="panel"><div id="nickHud">ИГРОК</div><div class="meter"><div class="fill" id="hp"></div></div></div><div class="panel" id="scoreHud">СЧЁТ 0000<br>РАУНД 1</div></div><div id="status">ЗАГРУЗКА ДВОРА...</div></div>
<div id="menu"><div id="card"><h1>ДВОРОВЫЕ<br>РАЗБОРКИ</h1><p>КАЗАНЬ · 1996<br>Пиксельная уличная драка</p><div class="row"><input id="nick" maxlength="16" value="Игрок" aria-label="Имя"><input id="room" maxlength="10" value="DVOR96" aria-label="Комната"></div><div class="row"><select id="mode"><option value="coop">КО-ОП · ПРОТИВ ДВОРА</option><option value="versus">РАЗБОРКА · PvP</option></select><select id="fighter"><option value="den">ДЕН · СКОРОСТЬ</option><option value="max">МАКС · СИЛА</option></select></div><button id="start">ВОЙТИ ВО ДВОР</button><p class="small">На компьютере: WASD / стрелки, J удар, K прыжок, L блок.<br>На телефоне: джойстик и кнопки справа. Для игры вдвоём введите одинаковый код комнаты.</p><p class="small" id="connection">Соединение с сервером проверяется при входе.</p></div></div>
<div id="controls"><div class="pad" id="pad"><div class="nub" id="nub"></div></div><div class="actions"><button class="act" id="punch">УДАР</button><button class="act alt" id="jump">ПРЫЖОК</button><button class="act alt" id="block">БЛОК</button><button class="act" id="leave">ВЫХОД</button></div></div><div id="toast"></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const W=480,H=270;let scale=1,players=new Map(),enemies=new Map(),myId=null,mode='coop',room='DVOR96',ws=null,connected=false,started=false,worldX=0,last=0,toastTimer=0,round=1,score=0,health=100,attackAt=0,combo=0,comboAt=0,keys={},joy={x:0,y:0},padPointer=null,blocking=false,jumping=false,particles=[];
function resize(){const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);scale=Math.min(canvas.width/W,canvas.height/H);ctx.imageSmoothingEnabled=false;}addEventListener('resize',resize);resize();
function say(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',1800)}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){room=($('room').value||'DVOR96').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,10);mode=$('mode').value;const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(proto+'//'+location.host);ws.onopen=()=>{connected=true;send({type:'join',room,nick:$('nick').value,mode,fighter:$('fighter').value});$('connection').textContent='Сервер подключён.'};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){myId=m.id;mode=m.mode;players.clear();enemies.clear();m.players.forEach(p=>players.set(p.id,p));(m.enemies||[]).forEach(x=>enemies.set(x.id,x));$('menu').style.display='none';$('nickHud').textContent=$('nick').value.toUpperCase();started=true;say(mode==='coop'?'Держитесь вместе. Двор уже заметил вас.':'Соперник найден. Начинайте!');}else if(m.type==='state'){players.clear();m.players.forEach(p=>players.set(p.id,p));enemies.clear();(m.enemies||[]).forEach(x=>enemies.set(x.id,x));score=m.score||0;round=m.round||1;const me=players.get(myId);if(me)health=me.hp;$('scoreHud').innerHTML='СЧЁТ '+String(score).padStart(4,'0')+'<br>РАУНД '+round;}else if(m.type==='notice')say(m.text);else if(m.type==='error')say(m.message);};ws.onclose=()=>{connected=false;if(started){say('Связь потеряна. Переподключитесь.');started=false;$('menu').style.display='grid'}};ws.onerror=()=>{$('connection').textContent='Ошибка соединения. Обновите страницу.'}}
$('start').onclick=connect;
function action(a){if(!started)return;send({type:'action',action:a});if(a==='attack'){attackAt=performance.now();combo=performance.now()-comboAt<850?combo+1:1;comboAt=performance.now();}}
function bind(id,a){$(id).addEventListener('pointerdown',e=>{e.preventDefault();action(a)})}bind('punch','attack');bind('jump','jump');$('block').addEventListener('pointerdown',e=>{e.preventDefault();blocking=true;send({type:'block',value:true})});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('block').addEventListener(ev,()=>{blocking=false;send({type:'block',value:false})}));$('leave').onclick=()=>{if(ws)ws.close();started=false;$('menu').style.display='grid'};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='j'||k===' ')action('attack');if(k==='k'||k==='arrowup')action('jump');if(k==='l')send({type:'block',value:true})});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key.toLowerCase()==='l')send({type:'block',value:false})});
const pad=$('pad'),nub=$('nub');function setJoy(e){const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.hypot(dx,dy),max=43,s=len>max?max/len:1;joy.x=dx*s/max;joy.y=dy*s/max;nub.style.transform='translate('+joy.x*40+'px,'+joy.y*40+'px)'}pad.addEventListener('pointerdown',e=>{padPointer=e.pointerId;pad.setPointerCapture(e.pointerId);setJoy(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer)setJoy(e)});function reset(e){if(e.pointerId===padPointer){padPointer=null;joy={x:0,y:0};nub.style.transform='translate(0,0)'}}['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pad.addEventListener(ev,reset));
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function text(t,x,y,size=8,color='#f6e7c9'){ctx.font='bold '+size+'px monospace';ctx.fillStyle='#111';ctx.fillText(t,x+1,y+1);ctx.fillStyle=color;ctx.fillText(t,x,y)}
function drawBg(cam){rect(0,0,W,H,'#252b38');rect(0,0,W,124,'#4d5865');rect(0,112,W,50,'#313b47');
for(let i=-1;i<9;i++){let x=i*76-(cam*.22%76);rect(x,28,54,93,'#7c7770');rect(x+5,34,44,80,'#9b9282');for(let j=0;j<3;j++){rect(x+10+j*13,48,7,10,'#394b5a');rect(x+10+j*13,72,7,10,'#394b5a')}rect(x+2,20,50,8,'#554e4a');}
rect(0,122,W,12,'#d0b58b');rect(0,134,W,136,'#6d6254');rect(0,148,W,5,'#847561');for(let i=0;i<15;i++){let x=((i*61-cam*.9)%W+W)%W;rect(x,160+(i%3)*25,2,2,'#a18c6e');rect(x+9,192+(i%2)*22,3,2,'#504a43')}
rect(12,136,48,17,'#9b382c');rect(16,139,40,3,'#e0b76e');text('ГАРАЖ №7',17,149,6);rect(364,120,104,7,'#2f3e31');rect(369,113,94,8,'#4b6b46');}
function drawFighter(p,me=false){const x=p.x-worldX+W/2,y=157+p.y*.48-(p.z||0)*.55;const hurt=p.hp<=0;ctx.save();ctx.translate(Math.round(x),Math.round(y));if(p.face===-1)ctx.scale(-1,1);rect(-8,4,16,4,'#29252a');rect(-6,-1,5,8,'#252b37');rect(2,-1,5,8,'#252b37');rect(-7,-16,14,17,p.color||'#3f6884');rect(-9,-14,3,10,'#c58d62');rect(6,-14,3,10,'#c58d62');rect(-6,-27,12,11,'#c58d62');rect(-7,-30,14,5,p.hair||'#3b2925');rect(-4,-23,2,2,'#191919');rect(3,-23,2,2,'#191919');rect(-8,-7,16,3,'#d6b66d');if(p.block)rect(8,-20,5,12,'#e0c38a');if(p.hit)rect(8,-16,10,4,'#f4d37a');ctx.restore();if(me){$('hp').style.width=Math.max(0,p.hp)+'%';}}
function drawEnemy(e){const x=e.x-worldX+W/2,y=157+e.y*.48-e.z*.55;ctx.save();ctx.translate(Math.round(x),Math.round(y));rect(-7,4,14,4,'#282329');rect(-6,-1,5,8,'#20232b');rect(2,-1,5,8,'#20232b');rect(-7,-16,14,16,e.color||'#843b34');rect(-6,-27,12,11,'#b27d58');rect(-7,-30,14,5,'#26232a');rect(-4,-23,2,2,'#111');rect(3,-23,2,2,'#111');ctx.restore();rect(x-9,y-37,18,3,'#321f24');rect(x-9,y-37,18*Math.max(0,e.hp)/100,3,'#d85b45');}
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;const me=players.get(myId);if(started&&me){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)-joy.y;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}sendMove(x,y,t);worldX+=(me.x-worldX)*.08;}
ctx.setTransform(1,0,0,1,0,0);rect(0,0,canvas.width,canvas.height,'#151923');ctx.setTransform(scale,0,0,scale,(canvas.width-W*scale)/2,(canvas.height-H*scale)/2);drawBg(worldX);const all=[...players.values()].sort((a,b)=>a.y-b.y);all.forEach(p=>drawFighter(p,p.id===myId));[...enemies.values()].sort((a,b)=>a.y-b.y).forEach(drawEnemy);particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.life-=dt;rect(p.x-worldX+W/2,p.y,2,2,'#f4d37a')});if(me){text('КОМБО ×'+Math.max(1,combo),12,254,8,'#f3c979');if(mode==='coop')text('ВРАГОВ: '+enemies.size,370,254,8,'#f3c979');}else if(!started){text('ВОЙДИ ВО ДВОР',175,220,10,'#f3c979');}}
let lastMove=0;function sendMove(x,y,t){if(t-lastMove<65)return;lastMove=t;send({type:'move',x,y,block:blocking})}
requestAnimationFrame(frame);
})();
</script></body></html>
