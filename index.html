<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Двор на двор: Казань, 1996</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101820;color:#fff;font:15px Arial}#game{position:fixed;inset:0}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000}.panel{background:#101820d9;border:1px solid #ffffff40;border-radius:9px;padding:9px}#lobby{position:fixed;inset:0;display:grid;place-items:center;background:#071018dd;padding:16px}.card{width:min(500px,100%);padding:22px;background:#1c2a34;border:1px solid #c49a62;border-radius:14px;text-align:center}h1{color:#e8bd82}input,button{width:100%;padding:13px;margin:5px 0;border:0;border-radius:7px;font-size:16px}input{background:#0e171e;color:white;border:1px solid #71808b}button{background:#d99a57;font-weight:bold}#status{font-size:13px;color:#cbd5dc;min-height:22px}#controls{position:fixed;bottom:18px;left:0;right:0;display:none;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.pad,.actions{pointer-events:auto;display:flex;gap:8px}.pad button,.actions button{width:64px;height:64px;border-radius:50%;background:#172630d9;color:white;border:1px solid #ffffff70;touch-action:none}.actions{flex-direction:column}.actions button{width:72px;height:52px;border-radius:12px}#hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#ddd;background:#101820bb;padding:5px 9px;border-radius:6px;white-space:nowrap}@media(min-width:700px){#controls{display:none!important}}
</style></head><body><div id="game"></div>
<div id="hud"><div class="panel"><b>ДВОР НА ДВОР</b><br><span id="team">Не в игре</span><br><span id="count">0/10 игроков</span></div><div class="panel">КАЗАНЬ · 1996<br><span id="roomTag">КОМНАТА —</span></div></div>
<div id="lobby"><div class="card"><h1>ДВОР НА ДВОР</h1><p>Казань, 1996. Онлайн-арена до 10 игроков: две команды по пять.</p><input id="nick" maxlength="16" value="Игрок" placeholder="Ник"><input id="room" maxlength="8" value="DVOR96" placeholder="Код комнаты"><input id="server" value="wss://YOUR-SERVER.onrender.com" placeholder="Адрес WebSocket-сервера"><button id="join">ВОЙТИ ВО ДВОР</button><div id="status">Сначала нужно опубликовать сервер и заменить адрес выше.</div></div></div>
<div id="controls"><div class="pad"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div class="actions"><button id="block">БЛОК</button><button id="hit">УДАР</button></div></div><div id="hint">ПК: WASD + J · Телефон: кнопки на экране</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{
const status=document.getElementById('status');if(!window.THREE){status.textContent='Не загрузилась 3D-библиотека. Проверь интернет.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x77838a);scene.fog=new THREE.Fog(0x77838a,30,90);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5edf0,0x34302a,2));const sun=new THREE.DirectionalLight(0xffd6a0,2);sun.position.set(-12,24,12);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
function box(w,h,d,c,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));o.position.set(x,y,z);scene.add(o);return o}
box(100,.4,100,0x414746,0,-.25,0);
function building(x,z,w,d,h){box(w,h,d,0x77766e,x,h/2,z);for(let y=2;y<h-1;y+=3)for(let a=-w/2+2;a<w/2-1;a+=4)box(1.5,1.5,.12,0x314653,x+a,y,z-d/2-.08)}
building(-23,-25,28,10,18);building(24,-28,30,10,20);building(-35,12,12,14,12);
box(5,1.1,2.4,0x555b60,24,1,8);box(2.8,.8,2,0x273c48,24,2,8);
const players=new Map();let ws=null,myId=null,myTeam='',keys={},lastSend=0,attackUntil=0;
function person(p){const g=new THREE.Group();scene.add(g);const color=p.team==='red'?0x9d4a3e:0x456e91;const body=new THREE.Mesh(new THREE.BoxGeometry(.85,1.05,.48),mat(color));body.position.y=1.55;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),mat(0xc58f70));head.position.y=2.3;g.add(head);const legs=[];for(const s of [-1,1]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.32,.85,.36),mat(0x262b30));leg.position.set(s*.22,.5,0);g.add(leg);legs.push(leg)}g.position.set(p.x||0,0,p.z||0);return {g,legs,team:p.team}}
function sync(list){const seen=new Set();for(const p of list){seen.add(p.id);if(!players.has(p.id))players.set(p.id,person(p));const o=players.get(p.id);o.g.position.x=THREE.MathUtils.lerp(o.g.position.x,p.x,.5);o.g.position.z=THREE.MathUtils.lerp(o.g.position.z,p.z,.5)}for(const [id,o] of players)if(!seen.has(id)){scene.remove(o.g);players.delete(id)}document.getElementById('count').textContent=list.length+'/10 игроков'}
function send(type,extra={}){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,...extra}))}
function join(){const url=document.getElementById('server').value.trim();if(!url||url.includes('YOUR-SERVER')){status.textContent='Сначала укажи адрес опубликованного WebSocket-сервера.';return}status.textContent='Подключение…';try{ws=new WebSocket(url)}catch(e){status.textContent='Неверный адрес сервера';return}
ws.onopen=()=>send('join',{room:document.getElementById('room').value.trim(),nick:document.getElementById('nick').value.trim()||'Игрок'});
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){myId=m.id;myTeam=m.team;document.getElementById('team').textContent='ТВОЯ КОМАНДА: '+(myTeam==='red'?'КРАСНЫЕ':'СИНИЕ');document.getElementById('roomTag').textContent='КОМНАТА '+m.room;document.getElementById('lobby').style.display='none';if(innerWidth<700)document.getElementById('controls').style.display='flex';sync(m.players)}if(m.type==='state')sync(m.players);if(m.type==='event')status.textContent=m.nick+' атакует!';if(m.type==='error')status.textContent=m.message};
ws.onerror=()=>status.textContent='Ошибка соединения. Проверь адрес сервера.';ws.onclose=()=>{document.getElementById('lobby').style.display='grid';status.textContent='Соединение закрыто.'}}
document.getElementById('join').onclick=join;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='j'&&Date.now()>attackUntil){attackUntil=Date.now()+450;send('action',{action:'attack'})}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function hold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[key]=false)}
hold('up','w');hold('left','a');hold('down','s');hold('right','d');hold('block',' ');document.getElementById('hit').addEventListener('pointerdown',()=>{if(Date.now()>attackUntil){attackUntil=Date.now()+450;send('action',{action:'attack'})}});
let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-prev)/1000,.04);prev=now;const me=players.get(myId);if(me){let dx=(keys.d?1:0)-(keys.a?1:0),dz=(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(dx,dz)||1;me.g.position.x=THREE.MathUtils.clamp(me.g.position.x+dx/l*6*dt,-43,43);me.g.position.z=THREE.MathUtils.clamp(me.g.position.z+dz/l*6*dt,-35,35);if(now-lastSend>70){lastSend=now;send('move',{x:me.g.position.x,z:me.g.position.z,action:keys[' ']?'block':'idle'})}me.legs.forEach((leg,i)=>leg.rotation.x=Math.sin(now*.012+i*Math.PI)*.18*Math.min(1,Math.hypot(dx,dz)))}
const target=me?me.g.position:new THREE.Vector3(0,0,10);camera.position.lerp(new THREE.Vector3(target.x,13,target.z+19),.08);camera.lookAt(target.x,1,target.z);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(loop);
})();
</script></body></html>
